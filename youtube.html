<!DOCTYPE Html>
<html>
    <head>
        <title>Youtube.com</title>
        <style>
            p {
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                margin-top:0;
                margin-bottom:0;
            }
            .search{
                display:block;
                margin-bottom: 10px;
            }
            .image{
                width: 300px;
                margin-bottom: 10px;
            }
            .description{
                margin-top: 0%;
                font-weight: bold;
                font-style: Roboto ;
                line-height: 20px;
                margin-bottom: 10px;
            }
            .video1{
                display: inline-block;
                margin-right: 15px;

            }
            .video2{
                display: inline-block;
                vertical-align: top;

            }
            .channel{
                width: 50px;
                display: inline-block;
                vertical-align: top;
            }
            .video-info{
                width: 200px;
                display: inline-block;
            }
            .channel-img{
                width: 40px;
                border-radius: 150px;
            }
            .author , .video-stats{
                color:rgb(96, 96, 96);
            }

        </style>

</head>
    <body>
        <input class="search" type="text" placeholder="Search">

        <div class="video1">
            <div>
                <img class="image" src="images\thumbnail-1.webp">
            </div>
            <div>
                <div class="channel"><img class="channel-img" src="images\channel-1.jpeg"></div>
                <div class="video-info">
                     <p class="description">
                    Talking Tech and AI with Google CEO Sundar Pichai!
                    </p>
                    <p class="author">
                        Marques Brownlee
                    </p>
                    <p class="video-stats">
                        3.4M views · 6 months ago
                    </p>
                </div>
            </div>    
        </div>

        <div class="video2">
            <div>
                <img class="image" src="images\thumbnail-2.webp">
            </div>
            <div>
                <div class="channel"><img class="channel-img" src="images\channel-2.jpeg"> </div>
                <div class="video-info">
                    <p class="description">
                        Try Not To Laugh Challenge #9
                    </p>
                    <p class="author">
                        Markiplier
                    </p>
                    <p class="video-stats">
                        19M views · 4 years ago
                    </p>
                </div>     
            </div>
        </div>
    </body>
</html>
