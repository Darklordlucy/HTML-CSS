<!DOCTYPE html>
<html>
    <head>
        <title>Felxbox practice</title>
    </head>
    <body>
        <div style="
            display: flex;
            flex-direction: row;
            margin-bottom: 30px;">
            <div style="background-color: lightblue; width: 100px;">100px</div>
            <div style="background-color: pink;">div 2</div>
        </div>
        <div style="
            display: flex;
            flex-direction: row;
            margin-bottom: 30px;">
            <div style="background-color: lightblue; width: 100px;">100px</div>
            <div style="background-color: pink; flex: 1;">flex 1</div>
            <div style="background-color: lightblue; width: 100px; flex: 2;">flex 2</div>
        </div>
        <div style="
            display: flex;
            flex-direction: row;
            border-style: solid;
            border-color: grey;
            height: 70px;
            margin-bottom: 30px;
            justify-content: space-evenly;">
            <div style="background-color: lightblue; width: 100px;">100px</div>
            <div style="background-color: pink; width: 100px;">flex 1</div>
            <div style="background-color: lightblue; width: 100px;">flex 2</div>
        </div>
        <div style="
            display: flex;
            flex-direction: row;
            border-style: solid;
            border-color: grey;
            margin-bottom: 30px;
            height: 70px;
            justify-content: space-evenly;
            align-items:start;">
            <div style="background-color: lightblue; width: 100px;">100px</div>
            <div style="background-color: pink; width: 100px;">flex 1</div>
            <div style="background-color: lightblue; width: 100px;">flex 2</div>
        </div>
    </body>
</html>
